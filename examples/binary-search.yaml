# Hand-authored TS story specification; not a prompt-to-video input.
scene_id: binary-search
intent: 追查小白框的敲击回应，找到同一空间通路的另一端
concept: 在严格升序且唯一的有序数组中，通过比较中点缩小闭区间
prompt: 使用 $stickman-motion-skill 制作《谁在敲门》。敲框得到回应，展开陌生结构，随后才发现目标地址；用四次二分查询定位，最后以手穿框和敲击回响解开疑问。
duration_seconds: 85
renderer_scene: binary-search
engine: motion-canvas
assumptions:
  - 值严格升序且唯一，目标 63 存在；原数组不被删除、重排或改变
  - 原值为 2,5,8,12,19,24,28,31,37,42,48,55,63,70,81,96
  - 闭区间的中点向下取整；一基索引 8、12、14、13 对应 31、55、70、63
  - 查询复杂度不等于人物在空间中的移动时间
  - 空间通口及其声音传播是故事约定，不是二分查找的数学结论，不涉及时间穿越
objects:
  - id: case
    visual: 开场只有一个带接缝的小白框
  - id: ports
    visual: 拉开后依次出现的十六个有序通口，排除候选只变暗
  - id: handheld
    visual: 提起后才显出 63 的薄框，末段抬高以看清另一端的手
beats:
  - intent: 追查回应来源
    action: 5.00 与 5.28 秒敲两下，听到延迟回应，贴近听并拉开接缝
    operation: spatial_metaphor
    time: 0–10.8
  - intent: 理解结构和薄框的用途
    action: 十六通口依次展开，数值短暂可见后合盖；提起薄框，22.4 秒后才见地址 63
    operation: spatial_metaphor
    time: 10.8–24.2
  - intent: 用比较缩小范围
    action: 28.1、38、45.2、50.8 秒查中点；31 和 55 太小，70 太大，最后 63 匹配
    operation: evaluate
    time: 24.2–54
  - intent: 确认声音和框之间的关系
    action: 再敲、拉开内盖、伸手，另一端在手持框内出现；动指、敲框、听同节奏回应，再抽手
    operation: spatial_metaphor
    time: 54–85
