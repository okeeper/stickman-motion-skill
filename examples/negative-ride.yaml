# Story specification, not a generic renderer input.
scene_id: negative-ride
intent: 乘上方向可控的运载车，越过缺口取回左侧目标
concept: 一维速度设置值乘以 -1 会反号；连续两次恢复原值
prompt: 使用 $stickman-motion-skill，做一个 36 秒无台词故事，让角色通过试车、误判和重复操作理解负数乘法与方向反转，最终跨越缺口取回目标。
duration_seconds: 36
renderer_scene: negative-ride
assumptions:
  - 右为正、左为负；面板显示下一次运行的速度设置，而非停车时的瞬时速度
  - 一个速度单位对应每秒 40 像素；行驶时速度为正负 120 像素每秒
  - 设备需要独立启动，轨道限位使车辆停车；乘法本身不施加物理力
objects:
  - id: cart
    visual: 带轮子的运载车及方向箭头
  - id: inverter
    visual: 可触碰的 ×(-1) 按钮
  - id: destination
    visual: 缺口另一侧的星形目标
beats:
  - intent: 前往左侧
    action: 触碰启动按钮，车辆却向右行驶
    operation: spatial_metaphor
    result: 发现正方向不符合目标，追赶并观察
  - intent: 改变设置
    action: 按下反向按钮并观察箭头
    operation: evaluate
    equation: +3 × (-1) = -3
  - intent: 验证按钮的作用
    action: 再按一次，方向回到右侧
    operation: evaluate
    equation: -3 × (-1) = +3
  - intent: 使用发现完成目标
    action: 再次反向，跳上车并启动，抵达左侧取回目标
    operation: spatial_metaphor
    result: 同一规则解决开头的困境
