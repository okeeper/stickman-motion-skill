# Hand-authored TS story specification; not a prompt-to-video input.
scene_id: negative-ride
intent: 从追赶陌生箭头到理解反转时差，主动安排空中会合
concept: 乘以负一改变方向设置，实际运动需要连续制动和反转
prompt: 使用 $stickman-motion-skill 制作《别追，等它回来》。先观察和扑空，第一次拨片失衡后恢复，再验证、登箭、跳离；最终蓄力起跳拨片，等返向箭身接住。
duration_seconds: 75
renderer_scene: negative-ride
engine: motion-canvas
assumptions:
  - 右为正；设置 u 为正负二，每一设置单位映射为目标速度 0.45 米每秒
  - 13.2、36.4、61.14 秒的操作令 u 反号，实际速度 v 各在随后 0.6 秒内连续经过零并反向
  - 电机提供执行力，乘法本身不提供力；画内 u 是命令，不是瞬时实际速度
  - 腾空根部服从重力 9.81 米每平方秒的解析轨迹，不吸向移动落点
  - 固定骨长、抓点和编排恢复不是通用人体动力学
objects:
  - id: arrow
    visual: 单支白色滑动箭头，箭身可承重，转向随实际速度
  - id: inverter
    visual: 首次检查后露出的尾部乘负一拨片
  - id: protagonist
    visual: 橙色空心头火柴人，保留第一次失衡后的手腕反应
beats:
  - intent: 确认脚边物体是什么
    action: 跟随、探身、伸手差一点，观察尾部，13.2 秒触碰
    operation: spatial_metaphor
    time: 0–13.2
  - intent: 理解身体为什么失衡
    action: 第一次反转带倒，护身滚开，坐低检查手腕，重新起身
    operation: evaluate
    equation: (+2) × (-1) = -2
    time: 13.2–23.2
  - intent: 验证方向变化是否可预测
    action: 追上并在 36.4 秒再操作，观察完整减速与反转
    operation: evaluate
    equation: (-2) × (-1) = +2
    time: 23.2–40
  - intent: 感受支撑与安排会合
    action: 短跳登箭，带速跳离，跑到前侧等它靠近
    operation: spatial_metaphor
    time: 40–61.06
  - intent: 用已知反转时差接住自己
    action: 61.06 秒起跳，61.14 秒拨片后释放，61.92 秒落到返向箭身，吸震恢复
    operation: spatial_metaphor
    time: 61.06–75
