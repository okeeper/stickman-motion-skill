# Hand-authored TS story specification; not a prompt-to-video input.
scene_id: complex-rotation
intent: 从意外离地到主动改变抓握半径，借四次转动回到原台
concept: 固定原点的单位复数乘以 i，模长不变并逆时针转九十度
prompt: 使用 $stickman-motion-skill 制作《世界的侧面》。近处只有白杆一端；检查夹片后意外升起，抓紧、找支撑、验证规则，换手攀近支点，转回后翻身上杆再回台。
duration_seconds: 90
renderer_scene: complex-rotation
engine: motion-canvas
assumptions:
  - 原点固定，右为实轴正向，上为虚轴正向；被乘对象是向量端点，不是人体
  - 归一化模长为一，世界半径为 3.984 米；四次结果为 i、-1、-i、1
  - 连续旋转的中间角度是展示过程，只有到达九十度才显示该次离散乘法完成
  - 角色向支点攀移改变自己的抓握半径，不缩短白杆或改变复数模长
  - 夹片触发主动驱动为故事约定；悬挂、攀爬和翻身为编排的约束姿态，不是完整人体动力学
objects:
  - id: ledge
    visual: 圆外右侧的原落脚台，开场唯一支撑
  - id: vector
    visual: 白杆一端最先可见，第一次操作后才显示整体与固定支点
  - id: clip
    visual: 可掀开、携带与扣回的 i 夹片
  - id: trace
    visual: 实际旋转经过后逐段留下的四段弧线
beats:
  - intent: 弄清白杆端部的夹片
    action: 靠近触摸、掀开查看，第一次扣回后意外离地并本能抓紧
    operation: evaluate
    equation: 1 × i = i
    time: 0–13.9
  - intent: 找支撑并验证是否还能回去
    action: 脚试着找支撑、换握、看原台，31.2–32.5 秒第二次旋转到左侧
    operation: evaluate
    equation: i × i = -1
    time: 13.9–39
  - intent: 降低下一次旋转的身体位移
    action: 39–49.5 秒交替换手攀近支点，带着夹片；54.7–56 秒第三次转到下侧
    operation: spatial_metaphor
    time: 39–73
  - intent: 回到原落脚处
    action: 73–74.3 秒第四次旋转到右侧；翻身上杆、接跑、跳回原台，坐低喘息活动手指
    operation: evaluate
    equation: (-i) × i = 1; i^4 = 1
    time: 73–90
